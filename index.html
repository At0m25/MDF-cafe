// Installation sur l'écran d'accueil : bouton de la page À propos.
// pwa.ev = invitation d'installation du navigateur (Chrome / Android), pwa.help = consignes affichées quand elle n'existe pas (iPhone, autres navigateurs).
const pwa={ev:null,help:false};
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIos=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function vInstall(){
  if(isStandalone())return '<h2>Installer l’appli</h2><p class="sub">✓ L’appli est installée sur cet appareil.</p>';
  const how=isIos()?"Dans Safari, touche le bouton Partager (le carré avec une flèche vers le haut), puis « Sur l’écran d’accueil ».":"Ouvre le menu du navigateur (⋮), puis choisis « Installer l’application » ou « Ajouter à l’écran d’accueil ».";
  return `<h2>Installer l’appli</h2>
    <p class="sub">Ajoute l’appli à l’écran d’accueil pour l’ouvrir comme une application, avec son icône.</p>
    <div class="row" style="justify-content:center"><button class="btn" data-act="install">Installer sur l’écran d’accueil</button></div>${pwa.help?`<p class="sub">${how}</p>`:""}`
}
// Icône et manifeste d'installation : la page étant un seul fichier, le manifeste est créé ici plutôt que fourni à part.
function setupPwa(){
  const add=(rel,attrs)=>{
    const l=document.createElement("link");
    l.rel=rel;
    Object.entries(attrs).forEach(([k,v])=>l.setAttribute(k,v));
    document.head.appendChild(l)
  };
  add("icon",{type:"image/png",href:ICON_192});
  add("apple-touch-icon",{href:ICON_192});
  try{
    const m={id:APP_URL,name:"Qui paie le café ?",short_name:"Café ?",lang:"fr",start_url:APP_URL,scope:APP_URL,display:"standalone",background_color:"#F5F7FA",theme_color:"#2F5BEA",
      icons:[{src:ICON_192,sizes:"192x192",type:"image/png",purpose:"any"},{src:ICON_512,sizes:"512x512",type:"image/png",purpose:"any"}]};
    add("manifest",{href:URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}))})
  }catch(e){}
}
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  pwa.ev=e;
  if(state.tab==="about")render()
});
window.addEventListener("appinstalled",()=>{
  pwa.ev=null;
  render()
});

// Copie l'adresse du site dans le presse-papiers et l'indique sur le bouton.
async function copyLink(btn){
  const label=btn.textContent,done=m=>{btn.textContent=m;setTimeout(()=>{btn.textContent=label},2000)};
  try{
    if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(APP_URL);
    else{
      const ta=document.createElement("textarea");
      ta.value=APP_URL;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();
      const ok=document.execCommand("copy");
      ta.remove();
      if(!ok)throw new Error("copie")
    }
    done("Lien copié ✓")
  }catch(_){done("Copie impossible")}
}

/* ---------- 11. ÉVÉNEMENTS ----------
   Délégation : chaque bouton porte data-act et est traité par CLICK[act] ; chaque champ (case, liste, saisie) par CHANGE[act].
   Les données utiles sont lues dans les attributs data-v (valeur), data-d (date du tirage) et data-id (personne, jeu ou record). */

// Affiche une année dans les stats (mois de la timeline et du calendrier remis au mois courant).
function showYear(y){
  state.statYear=y;
  state.tl.m=-1;
  state.cal.m=-1
}
// Retour à l'année en cours à l'ouverture de l'onglet Stats, et au passage à la nouvelle année si la page reste ouverte.
let lastYear=curYear();
// Si l'année a changé depuis le dernier contrôle, affiche la nouvelle année.
function checkYear(){
  const y=curYear();
  if(y===lastYear)return;
  lastYear=y;
  showYear(y);
  render()
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkYear()});
setInterval(checkYear,60000);

// Décale le mois affiché (timeline ou calendrier) de delta mois, entre janvier et décembre.
function moveMonth(o,delta){
  o.m=Math.min(11,Math.max(0,shownMonth(o)+delta));
  render()
}

// Boutons : data-act → action. Chaque action reçoit le bouton cliqué.
const CLICK={
  // Navigation et stats
  tab(b){
    if(b.dataset.v==="stats"&&state.tab!=="stats")showYear(curYear());
    state.tab=b.dataset.v;
    state.anim=state.tab==="stats";
    state.editing=null;
    state.draft=null;
    state.confirmDel=null;
    render()
  },
  year(b){
    showYear(b.dataset.v);
    state.anim=true;
    render()
  },
  tlmode(b){state.tl.mode=b.dataset.v;render()},
  calmode(b){state.cal.mode=b.dataset.v;render()},
  tlnav(b){moveMonth(state.tl,+b.dataset.v)},
  calnav(b){moveMonth(state.cal,+b.dataset.v)},
  // Exports et partage
  xlsx(){exportAll("xlsx")},
  zipcsv(){exportAll("zipcsv")},
  csv(){exportCsv()},
  copylink(b){copyLink(b)},
  // Options de l'appareil : thème
  theme(b){
    lsSet("theme",b.dataset.v);
    applyTheme();
    render()
  },
  // Installation : invitation du navigateur si elle existe, sinon consignes
  async install(){
    const e=pwa.ev;
    if(!e){
      pwa.help=true;
      render();
      return
    }
    pwa.ev=null;
    try{
      await e.prompt();
      await e.userChoice
    }catch(_){}
    render()
  },
  // Options : monte ou descend un record dans la liste (data-d = -1 ou 1)
  recmove(b){
    const o=recIds(),i=o.indexOf(b.dataset.id),j=i+(+b.dataset.d);
    if(i<0||j<0||j>=o.length)return;
    [o[i],o[j]]=[o[j],o[i]];
    gamesOpts().order=o;
    render();
    saveGames()
  },
  // Tirage du jour : lancer (avec confirmation s'il existe déjà), tout sélectionner / désélectionner
  draw(){
    const cur=getDraw(todayStr());
    if(cur&&payersOf(cur).length&&state.confirmDel!=="redraw"){
      state.confirmDel="redraw";
      render();
      return
    }
    state.confirmDel=null;
    pick()
  },
  // Annule le dernier tirage du jour : retour aux payeurs d'avant (relance annulée) ou à « pas de payeur » ; les présents ne changent pas
  undo(){
    const t=todayStr(),cur=getDraw(t);
    if(!cur||!payersOf(cur).length||state.busy)return;
    const next={id:t,date:t,present:[...(cur.present||[])],payers:undoBack(cur),price:state.price,edited:!!cur.edited};
    lsDel("undoDraw");
    state.confirmDel=null;
    state.msg="";
    putDraw(next);
    render();
    saveDraw(next)
  },
  selall(){
    const t=todayStr(),cur=getDraw(t)||{present:[],payers:[],edited:false},ids=state.people.filter(p=>p.active!==false).map(p=>p.id);
    if(!ids.length)return;
    const present=ids.every(x=>cur.present.includes(x))?cur.present.filter(x=>!ids.includes(x)):[...new Set([...cur.present,...ids])],
      next={id:t,date:t,present,payers:payersOf(cur).filter(x=>present.includes(x)),price:state.price,edited:!!cur.edited};
    putDraw(next);
    render();
    saveDraw(next)
  },
  // Historique : modifier (avec confirmation), annuler, +1, valider, supprimer, ajouter un jour
  edit(b){
    const d=b.dataset.d;
    if(state.confirmDel==="edit:"+d){
      const x=getDraw(d);
      state.editing=d;
      state.draft={id:d,present:[...((x&&x.present)||[])],payers:x?[...payersOf(x)]:[]};
      state.confirmDel=null
    }else state.confirmDel="edit:"+d;
    render()
  },
  cancel(){
    const x=getDraw(state.editing);
    state.editing=null;
    state.draft=null;
    state.confirmDel=null;
    // Un jour vide créé par erreur (ni présents ni payeur, hors aujourd'hui) est supprimé
    if(x&&x.id!==todayStr()&&!(x.present||[]).length&&!payersOf(x).length){
      state.draws=state.draws.filter(y=>y.id!==x.id);
      render();
      persist(()=>state.db.from("draws").delete().eq("id",x.id))
    }else render()
  },
  plus1(b){
    // Le reste de la division va aux premiers payeurs de la liste : on place le payeur choisi en tête
    const n=state.draft,id=b.dataset.id;
    if(n&&n.id===b.dataset.d){
      const i=n.payers.indexOf(id);
      if(i>0){
        n.payers.splice(i,1);
        n.payers.unshift(id)
      }
      render()
    }
  },
  save(b){
    const d=b.dataset.d,n=state.draft;
    if(!n||n.id!==d)return;
    const ex=getDraw(d),next={id:d,date:d,present:[...n.present],payers:[...n.payers],price:ex?priceOf(ex):state.price,edited:true};
    putDraw({...ex,...next});
    state.editing=null;
    state.draft=null;
    state.confirmDel=null;
    render();
    saveDraw(next)
  },
  del(b){
    const d=b.dataset.d;
    if(state.confirmDel===d){
      state.confirmDel=null;
      state.editing=null;
      state.draft=null;
      state.draws=state.draws.filter(x=>x.id!==d);
      render();
      persist(()=>state.db.from("draws").delete().eq("id",d))
    }else{
      state.confirmDel=d;
      render()
    }
  },
  newday(){
    const v=state.ndVal;
    if(!v)return;
    if(v>todayStr()){
      state.msg="Impossible d’ajouter un tirage dans le futur.";
      render();
      return
    }
    if(getDraw(v)){
      // Le jour existe déjà : on demande confirmation pour l'éditer
      state.confirmDel="edit:"+v;
      render();
      return
    }
    state.msg="";
    state.editing=v;
    state.draft={id:v,present:[],payers:[]};
    const next={id:v,date:v,present:[],payers:[],price:state.price,edited:true};
    putDraw(next);
    render();
    saveDraw(next)
  },
  // Équipe : ajouter (sans doublon de prénom actif), retirer (désactiver), réactiver
  add(){
    const n=state.newName.trim();
    if(!n)return;
    state.newName="";
    render();
    if(!state.people.some(p=>p.active!==false&&p.name.toLowerCase()===n.toLowerCase()))persist(()=>state.db.from("people").insert([{name:n,active:true}]))
  },
  // Invité d'un jour : ajouté aux présents d'aujourd'hui sans entrer dans l'équipe (personne « inactive » listée dans settings.games.guests ; un invité déjà venu est réutilisé)
  guest(){
    const n=state.newGuest.trim();
    if(!n)return;
    const same=state.people.filter(p=>p.name.toLowerCase()===n.toLowerCase());
    if(same.some(p=>p.active!==false)){
      state.msg=n+" fait déjà partie de l’équipe : coche-le dans le Tirage du jour.";
      render();
      return
    }
    const old=same.find(p=>isGuest(p.id));
    if(same.length&&!old){
      state.msg=n+" est dans les Anciens de l’équipe : réactive-le plutôt.";
      render();
      return
    }
    state.newGuest="";
    state.msg="";
    const t=todayStr(),cur=getDraw(t)||{id:t,date:t,present:[],payers:[],edited:false},mk=id=>({id:t,date:t,present:[...new Set([...(cur.present||[]),id])],payers:payersOf(cur),price:state.price,edited:!!cur.edited});
    if(old){
      const next=mk(old.id);
      putDraw(next);
      render();
      saveDraw(next);
      return
    }
    render();
    persist(async()=>{
      const r=await state.db.from("people").insert([{name:n,active:false}]).select("id").single();
      if(r.error)throw r.error;
      const id=r.data.id,g=gamesOpts();
      g.guests=[...arrOf(g,"guests"),id];
      lsSet("gamesOpt",g);
      try{
        const s=await state.db.from("settings").upsert([{key:"main",games:g}]);
        if(s.error)throw s.error;
        state.gshared=true
      }catch(e){state.gshared=false}
      const d=await state.db.from("draws").upsert([mk(id)]);
      if(d.error)throw d.error
    })
  },
  gout(b){togglePresent(b.dataset.id)},
  rm(b){setActive(b.dataset.id,false)},
  react(b){setActive(b.dataset.id,true)}
};
// Active ou désactive une personne (mise à jour immédiate puis écriture).
function setActive(id,active){
  state.people=state.people.map(p=>p.id===id?{...p,active}:p);
  render();
  persist(()=>state.db.from("people").update({active}).eq("id",id))
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"),f=b&&CLICK[b.dataset.act];
  if(f)f(b)
});

// Champs : data-act → action. Chaque action reçoit le champ modifié (t).
const CHANGE={
  // Présence du jour et prix du café
  pres(t){togglePresent(t.dataset.id)},
  price(t){
    const v=parseFloat(t.value.replace(",","."));
    if(Number.isFinite(v)&&v>=0){
      state.price=v;
      render();
      persist(()=>state.db.from("settings").upsert([{key:"main",price:v}]))
    }
  },
  // Options des jeux : activer / désactiver (au moins un reste actif), jeu par défaut, limite de cafés par payeur
  gon(t){
    const g=gamesOpts();
    if(!t.checked&&enabledGames().length<=1){
      t.checked=true;
      state.msg="Garde au moins un jeu activé.";
      render();
      return
    }
    g.off=withItem(g.off,t.dataset.id,!t.checked);
    if(g.off.includes(g.def))g.def=(enabledGames()[0]||{}).id;
    saveGames()
  },
  gdef(t){
    gamesOpts().def=t.value;
    saveGames()
  },
  lim(t){
    const v=Math.round(+t.value);
    if(v>=1&&v<=50){
      gamesOpts().lim=v;
      saveGames()
    }else render()
  },
  // Options des records : affiché ou masqué, podium (case cochée) ou top
  rec(t){
    const g=gamesOpts();
    g.hide=withItem(arrOf(g,"hide"),t.dataset.id,!t.checked);
    saveGames()
  },
  rectop(t){
    const g=gamesOpts();
    g.top=withItem(arrOf(g,"top"),t.dataset.id,!t.checked);
    saveGames()
  },
  // Durée de la course (appareil)
  rdur(t){
    const v=Math.round(+t.value);
    if(v>=5&&v<=60){
      raceDur=v;
      lsSet("raceDur",v)
    }
    render()
  },
  // Stats : joueur du calendrier
  calp(t){state.cal.pid=t.value;render()},
  // Historique : présents et payeurs d'un jour en cours d'édition (brouillon state.draft)
  hpres:editDraft,
  hpay:editDraft
};
// Coche / décoche un présent (hpres) ou un payeur (hpay) dans le brouillon ; un payeur est aussi présent, un absent n'est plus payeur.
function editDraft(t){
  const n=state.draft,id=t.dataset.id;
  if(!n||n.id!==t.dataset.d)return;
  if(t.dataset.act==="hpres"){
    n.present=withItem(n.present,id,!n.present.includes(id));
    n.payers=n.payers.filter(x=>n.present.includes(x))
  }else{
    n.payers=withItem(n.payers,id,!n.payers.includes(id));
    if(n.payers.includes(id)&&!n.present.includes(id))n.present.push(id)
  }
  render()
}
document.addEventListener("change",e=>{
  const t=e.target,f=t.dataset&&CHANGE[t.dataset.act];
  if(f)f(t)
});
// Mémorise les encadrés de stats ouverts ou fermés (l'événement toggle ne remonte pas : écoute en capture).
document.addEventListener("toggle",e=>{const g=e.target.dataset&&e.target.dataset.grp;if(g)state.open[g]=e.target.open},true);
// Saisies mémorisées pour survivre aux re-rendus.
document.addEventListener("input",e=>{
  if(e.target.id==="nn")state.newName=e.target.value;
  if(e.target.id==="gn")state.newGuest=e.target.value;
  // Durée de la course : la valeur s'affiche pendant que le curseur bouge
  if(e.target.id==="rdd")document.querySelector("#rdo").textContent=+e.target.value>=60?"1 min":e.target.value+" s";
  if(e.target.id==="nd")state.ndVal=e.target.value
});
// Entrée dans le champ prénom = bouton Ajouter.
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.target.id==="nn"||e.target.id==="gn")){
    e.preventDefault();
    document.querySelector(e.target.id==="nn"?'[data-act="add"]':'[data-act="guest"]').click()
  }
});
/* ---------- 12. DÉMARRAGE ---------- */
// Premier rendu (« Chargement… »), puis connexion Supabase, verrou temps réel et abonnement aux changements.
applyTheme();
setupPwa();
render();
(async()=>{
  if(!SUPABASE_URL||SUPABASE_URL.startsWith("VOTRE")){
    state.nodb=true;
    render();
    return
  }
  state.db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}});
  state.cid=Math.random().toString(36).slice(2);
  state.lk=state.db.channel("draw-lock",{config:{presence:{key:state.cid}}});
  state.lk.on("presence",{event:"sync"},()=>{
    const ps=state.lk.presenceState();
    const b=Object.entries(ps).some(([k,v])=>k!==state.cid&&v.some(m=>m.drawing));
    if(b!==state.busy){state.busy=b;render()}
  }).subscribe(st=>{
    if(st==="SUBSCRIBED")state.lk.track({drawing:false})
  });
  state.timer=setTimeout(()=>{
    if(!(state.loaded.people&&state.loaded.draws&&state.loaded.settings)){
      state.msg="Données injoignables pour l’instant. Vérifie ta connexion.";
      render()
    }
  },10000);
  try{
    await fetchAll();
    recoverPending()
  }catch(e){
    showError("Lecture impossible : ",e)
  }
  state.db.channel("public-db").on("postgres_changes",{event:"*",schema:"public"},async()=>{
    try{
      await fetchAll()
    }catch(e){
      showError("Lecture impossible : ",e)
    }
  }).subscribe()
})();
