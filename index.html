const amt=d=>(d.present||[]).length*priceOf(d);
const eur=n=>n.toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
// Tirages de l'année affichée dans les stats (les compteurs repartent à zéro chaque année).
const yd=()=>state.draws.filter(d=>d.id.slice(0,4)===state.statYear);
// Vrai si la personne existe et n'est pas désactivée.
const isActive=id=>{
  const p=state.people.find(x=>x.id===id);
  return !!p&&p.active!==false
};
state.ndVal=todayStr();
/* ---------- 3. RENDU ---------- */
// Redessine l'écran complet à partir de l'état, en conservant le focus du champ actif.
function render(){
  const activeId=document.activeElement&&document.activeElement.id;
  let view;
  if(state.nodb)view='<p class="empty">Veuillez renseigner les clés SUPABASE_URL et SUPABASE_ANON_KEY dans le fichier HTML.</p>';
  else if(!(state.loaded.people&&state.loaded.draws&&state.loaded.settings))view='<p class="empty">Chargement…</p>';
  else view={today:vToday,hist:vHist,stats:vStats,team:vTeam,opts:vOpts}[state.tab]();
  const html=`<h1>Qui paie le café ?</h1>${state.msg?`<p class="err" role="alert">${esc(state.msg)}</p>`:""}<nav>${[["today","Tirage du jour"],["hist","Historique"],["stats","Stats"],["team","Équipe"],["opts","Options"]].map(([k,l])=>`<button data-act="tab" data-v="${k}" ${state.tab===k?'aria-current="true"':""}>${l}</button>`).join("")}</nav>${view}`;
  // Rien n'a changé à l'écran : on ne remplace pas le DOM (sinon un clic en cours peut être perdu)
  if(html===state.lastHtml){state.anim=false;return}
  state.lastHtml=html;
  app.innerHTML=html;
  if(activeId){
    const el=document.getElementById(activeId);
    if(el)el.focus()
  }
  state.anim=false
}

/* ---------- 4. DONNÉES (Supabase) ---------- */
// Recharge les 3 tables en parallèle puis redessine. Appelée au démarrage, après chaque écriture et à chaque changement temps réel.
async function fetchAll(){
  if(!state.db||state.pending>0)return;
  const w0=state.writes;
  const [p,d,s]=await Promise.all([state.db.from("people").select("*"),state.db.from("draws").select("*"),state.db.from("settings").select("*").eq("key","main").maybeSingle()]);
  if(p.error)throw p.error;
  if(d.error)throw d.error;
  if(s.error)throw s.error;
  if(state.pending>0||state.writes!==w0)return;
  state.people=p.data||[];
  state.draws=d.data||[];
  state.price=s.data?.price||0;
  state.gshared=!!(s.data&&Object.prototype.hasOwnProperty.call(s.data,"games"));
  {
    let g=state.gshared?s.data.games:null;
    if(!g){
      try{
        g=JSON.parse(localStorage.getItem("gamesOpt")||"null")
      }catch(e){}
    }
    state.games={off:(g&&Array.isArray(g.off)?g.off:[]),def:(g&&g.def)||"cartes"}
  }
  state.loaded={people:true,draws:true,settings:true};
  if(state.timer)clearTimeout(state.timer);
  state.msg="";
  render()
}

// Reprise après fermeture en plein jeu : applique le tirage de secours mémorisé si le jour n'a toujours pas de payeur.
function recoverPending(){
  let r=null;
  try{
    r=JSON.parse(localStorage.getItem("pendingDraw")||"null");
    localStorage.removeItem("pendingDraw")
  }catch(e){}
  if(!r||r.id>todayStr())return;
  const d=getDraw(r.id);
  if(d&&pays(d).length)return;
  const i=state.draws.findIndex(x=>x.id===r.id);
  if(i>=0)state.draws[i]={...state.draws[i],...r};
  else state.draws.push(r);
  render();
  persist(()=>state.db.from("draws").upsert([r]))
}

// Jeux activés, le jeu par défaut en premier.
function gamesList(){
  const g=state.games||{off:[],def:"cartes"};
  let on=GAMES.filter(x=>!g.off.includes(x.id));
  if(!on.length)on=[...GAMES];
  const d=on.find(x=>x.id===g.def)||on[0];
  return[d,...on.filter(x=>x!==d)]
}

// Enregistre les options de jeux : partagées (colonne settings.games) si possible, sinon locales à l'appareil.
async function saveGames(){
  try{
    localStorage.setItem("gamesOpt",JSON.stringify(state.games))
  }catch(e){}
  try{
    const r=await state.db.from("settings").upsert([{key:"main",games:state.games}]);
    if(r.error)throw r.error;
    state.gshared=true;
    state.msg=""
  }catch(e){
    state.gshared=false;
    state.msg="Options des jeux enregistrées sur cet appareil seulement : la colonne « games » manque dans la table settings."
  }
  render()
}

// Exporte tous les tirages en CSV (séparateur « ; », BOM UTF-8 pour Excel).
function exportCsv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[["Date","Nombre de présents","Présents","Payeurs","Prix du café","Montant du tirage","Modifié"]];
  [...state.draws].sort((a,b)=>a.id<b.id?-1:1).forEach(d=>{
    const pr=d.present||[],py=pays(d),pc=priceOf(d);
    rows.push([d.id,pr.length,pr.map(nameOf).join(", "),py.map(nameOf).join(", "),pc?String(pc).replace(".",","):"",pc?(pr.length*pc).toFixed(2).replace(".",","):"",d.edited?"oui":"non"])
  });
  const csv="\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n"),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="tirages-cafe-"+todayStr()+".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}

// Écritures en file d'attente (une à la fois) : exécute fn, recharge les données, affiche l'erreur éventuelle.
function persist(fn){
  state.pending++;state.writes++;
  state.chain=state.chain.then(async()=>{
    const r=await fn();
    if(r?.error)throw r.error
  }).catch(e=>{
    state.msg="Enregistrement impossible : "+((e&&(e.message||e.code))||"erreur");
    render()
  }).then(async()=>{
    state.pending--;
    // Les données du serveur ne sont relues qu'une fois toutes les écritures terminées (évite les retours en arrière visibles)
    if(state.pending===0){
      try{await fetchAll()}catch(e){state.msg="Lecture impossible : "+((e&&(e.message||e.code))||"erreur");render()}
    }
  });
  return state.chain
}

/* ---------- 5. RÈGLES ET STATISTIQUES ---------- */
// Compteurs par personne pour l'année affichée : n = présences, p = cafés payés, m = montant payé, last = dernier paiement.
function stats(){
  const s={};
  yd().forEach(d=>{
    (d.present||[]).forEach(id=>{
      (s[id]=s[id]||{n:0,p:0,m:0,last:""}).n++
    });
    pays(d).forEach(id=>{
      const o=s[id]=s[id]||{n:0,p:0,m:0,last:""};
      o.p++;
      o.m+=amt(d)/Math.max(1,pays(d).length);
      if(d.id>o.last)o.last=d.id
    })
  });
  return s
}

// Dernier tirage avec payeur avant aujourd'hui : ses payeurs sont écartés du tirage suivant.
function prevDraw(){
  const t=todayStr();
  return state.draws.filter(d=>d.id<t&&pays(d).length).sort((a,b)=>a.id<b.id?1:-1)[0]
}

/* ---------- 6. TIRAGE ---------- */
// Verrou « tirage en cours » partagé en temps réel (présence Supabase) : libéré tout seul si l'onglet se ferme.
const setLock=b=>{
  try{
    if(state.lk)state.lk.track({drawing:b})
  }catch(e){}
};
// Lance un tirage : 1 payeur par tranche de 5 présents, hors payeurs de la veille si possible.
// Un tirage de secours (c) est mémorisé d'abord : il garantit toujours au moins un payeur si le jeu est interrompu.
function pick(){
  const t=todayStr(),cur=getDraw(t),present=((cur&&cur.present)||[]).filter(isActive);
  if(!present.length)return;
  if(picking||racing||state.busy){
    render();
    return
  }
  const pv=prevDraw(),ex=pv?pays(pv):[],k=Math.min(Math.ceil(present.length/5),present.length),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),pool=present.filter(id=>!ex.includes(id));
  let c=sh(pool).slice(0,k);
  if(c.length<k)c=c.concat(sh(present.filter(id=>!c.includes(id))).slice(0,k-c.length));
  setLock(true);
  try{
    localStorage.setItem("pendingDraw",JSON.stringify({id:t,date:t,present,payers:c,price:state.price,edited:false}))
  }catch(e){}
  chooseGame(present,c,res=>{
    setLock(false);
    try{
      localStorage.removeItem("pendingDraw")
    }catch(e){}
    persist(()=>state.db.from("draws").upsert([{id:t,date:t,present,payers:res||c,price:state.price,edited:false}]))
  },pool.length>k?pool:present)
}

/* ---------- 7. JEUX D'ANIMATION ----------
   Chaque jeu est une fonction run(present, c, done, cand) :
   present = présents actifs, c = tirage de secours, cand = candidats autorisés,
   done(payeurs) est appelée à la fin. Les jeux interactifs (fléchettes, roue, machine à sous)
   décident eux-mêmes du résultat ; la course, les cartes et le grattage révèlent c. */
// Course : durée réglable (5 s à 1 min), vitesse variable de chaque coureur, les derniers arrivés paient.
let racing=false,raceDur=15;
try{
  const v=+localStorage.getItem("raceDur");
  if(v>=5&&v<=60)raceDur=v
}catch(e){}

function race(present,c,done){
  if(racing)return;
  if(present.length<2||matchMedia("(prefers-reduced-motion:reduce)").matches){
    done();
    return
  }
  racing=true;
  const k=c.length,fD=v=>v>=60?"1 min":v+" s";
  const prof=()=>{
    const N=240,c1=1.44+Math.random()*2.88,c2=4.32+Math.random()*5.76,f1=Math.random()*6.28,f2=Math.random()*6.28,b1=.72+Math.random()*.58,b2=.43+Math.random()*.58,lo=.35+Math.random()*.1,hi=2.2+Math.random()*.5,tab=[0];
    for(let i=0; i<N; i++){
      const u=(i+.5)/N,sp=lo+(hi-lo)*.5*(1+(b1*Math.sin(6.283*c1*u+f1)+b2*Math.sin(6.283*c2*u+f2))/(b1+b2));
      tab.push(tab[i]+sp)
    }
    const tot=tab[N];
    return tab.map(x=>x/tot)
  };
  const L=present.map(id=>{
    const i=c.indexOf(id);
    return{id,fr:i<0?.55+Math.random()*.35:.93+.07*(i+1)/k,tab:prof()}
  });
  const ov=document.createElement("div");
  ov.className="rc";
  ov.innerHTML=`<div class="rb"><h2>${k>1?"Les "+k+" derniers paient":"Le dernier paie"} le café</h2>${L.map(l=>`<div class="ln"><span class="ln-n">${esc(nameOf(l.id))}</span><div class="ln-t"><span class="tk">${esc(nameOf(l.id).charAt(0).toUpperCase())}</span></div></div>`).join("")}<p class="rr" aria-live="polite">Règle la durée, puis donne le top départ.</p><div class="rg"><label for="rd">Durée de la course : <b id="rdv">${fD(raceDur)}</b></label><input type="range" id="rd" min="5" max="60" step="1" value="${raceDur}"></div><div class="row"><button class="btn" type="button" data-go>Top départ</button><button class="ghost" type="button" data-x>Tirage direct</button></div></div>`;
  document.body.appendChild(ov);
  const q=x=>ov.querySelector(x),tk=[...ov.querySelectorAll(".tk")],rr=q(".rr"),sl=q("#rd"),dv=q("#rdv"),bg=q("[data-go]"),bx=q("[data-x]");
  let raf=0,fin=false,t0=0,D=raceDur,key="";
  const pos=(l,t)=>{
    const u=Math.min(1,t/(l.fr*D)),N=l.tab.length-1,x=u*N,i=Math.min(N-1,Math.floor(x));
    return l.tab[i]+(l.tab[i+1]-l.tab[i])*(x-i)
  };
  const finish=()=>{
    if(fin)return;
    fin=true;
    cancelAnimationFrame(raf);
    tk.forEach((e,i)=>{
      e.style.left="calc(100% - 28px)";
      if(c.includes(L[i].id))e.classList.add("lo")
    });
    rr.textContent=list(c)+(c.length>1?" paient":" paie")+" le café !";
    bg.hidden=true;
    bx.hidden=true;
    sl.disabled=true;
    setTimeout(()=>{
      ov.remove();
      racing=false;
      done()
    },1800)
  };
  const step=now=>{
    const t=(now-t0)/1000,ps=L.map(l=>pos(l,t));
    ps.forEach((p,i)=>{
      tk[i].style.left=`calc((100% - 28px)*${p})`
    });
    if(t<D)raf=requestAnimationFrame(step);
    else finish()
  };
  sl.oninput=()=>{
    dv.textContent=fD(+sl.value)
  };
  bx.onclick=()=>{
    if(fin)return;
    fin=true;
    ov.remove();
    racing=false;
    done()
  };
  bg.onclick=()=>{
    D=+sl.value;
    raceDur=D;
    try{
      localStorage.setItem("raceDur",D)
    }catch(e){}
    sl.disabled=true;
    bg.hidden=true;
    bx.textContent="Passer";
    bx.onclick=finish;
    let n=3;
    const cd=()=>{
      if(fin)return;
      if(n>0){
        rr.textContent=n--;
        setTimeout(cd,600)
      }else{
        rr.textContent="Partez !";
        t0=performance.now();
        raf=requestAnimationFrame(step)
      }
    };
    cd()
  };
}

// Catalogue des jeux (l'ordre ici est celui de la liste ; les options permettent d'en désactiver).
const GAMES=[{id:"cartes",name:"Les cartes",desc:"Cartes mélangées face cachée : clique pour retourner celles des payeurs.",art:'<svg viewBox="0 0 64 32" width="64" height="32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="10" y="6" width="18" height="22" rx="3" opacity=".4"/><rect x="24" y="4" width="18" height="22" rx="3" fill="var(--soft)"/></g></svg>',run:gCards},{id:"course",name:"La course",desc:"Le dernier arrivé paie. Durée réglable de 5 s à 1 min.",art:'<svg viewBox="0 0 64 32" width="64" height="32" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" opacity=".35"><line x1="2" y1="6" x2="62" y2="6"/><line x1="2" y1="16" x2="62" y2="16"/><line x1="2" y1="26" x2="62" y2="26"/></g><g fill="currentColor"><circle cx="46" cy="6" r="4"/><circle cx="30" cy="16" r="4"/><circle cx="14" cy="26" r="4"/></g></svg>',run:race},{id:"darts",name:"Fléchettes",desc:"Clique sur la cible qui tourne : le secteur touché est tiré. Un tiré en moins à chaque lancer.",art:'<svg viewBox="0 0 64 32" width="64" height="32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="32" cy="16" r="14" opacity=".35"/><circle cx="32" cy="16" r="8" opacity=".5"/></g><circle cx="32" cy="16" r="3" fill="currentColor"/></svg>',run:gDarts},{id:"slots",name:"Machine à sous",desc:"Un rouleau par payeur : arrête-le quand tu veux, l’un après l’autre.",art:'<svg viewBox="0 0 64 32" width="64" height="32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="6" width="14" height="20" rx="3"/><rect x="25" y="6" width="14" height="20" rx="3"/><rect x="44" y="6" width="14" height="20" rx="3"/></g></svg>',run:gSlots},{id:"roue",name:"Roue à lancer",desc:"Lance la roue et arrête-la quand tu veux, une fois par payeur.",art:'<svg viewBox="0 0 64 32" width="64" height="32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="32" cy="16" r="14"/><path d="M32 2V30M18 16H46M22 6L42 26M42 6L22 26" opacity=".4"/></g></svg>',run:gWheel},{id:"gratte",name:"Grattage",desc:"Gratte les cases pour découvrir qui paie.",art:'<svg viewBox="0 0 64 32" width="64" height="32" aria-hidden="true"><rect x="12" y="6" width="40" height="20" rx="4" fill="currentColor" opacity=".35"/><path d="M18 22L30 10M26 22L38 10M34 22L46 10" stroke="currentColor" stroke-width="2"/></svg>',run:gScratch}];
// Fenêtre de jeu commune : titre, contenu, bouton « Passer ». g.end() affiche le résultat puis appelle done().
function box(title,body,c,done){
  racing=true;
  const ov=document.createElement("div");
  ov.className="rc";
  ov.innerHTML=`<div class="rb"><h2>${title}</h2>${body}<p class="rr" aria-live="polite"></p><div class="row"><button class="ghost" type="button" data-x>Passer</button></div></div>`;
  document.body.appendChild(ov);
  const g={ov,q:x=>ov.querySelector(x),rr:ov.querySelector(".rr"),dead:false,raf:0, say:t=>{
    g.rr.textContent=t
  }, end:()=>{
    if(g.dead)return;
    g.dead=true;
    cancelAnimationFrame(g.raf);
    const r=g.res||c;
    g.say(list(r)+(r.length>1?" paient":" paie")+" le café !");
    g.q("[data-x]").hidden=true;
    setTimeout(()=>{
      ov.remove();
      racing=false;
      done(g.res)
    },1800)
  }, wait:(f,ms)=>setTimeout(()=>{
    if(!g.dead)f()
  },ms)};
  g.q("[data-x]").onclick=()=>{
    if(g.fill)g.fill();
    g.end()
  };
  return g
}

// Secteurs SVG d'une roue (un par joueur), utilisés par les fléchettes et la roue.
function wedges(ids){
  const n=ids.length,w=360/n,R=100,P=(a,r)=>[(r*Math.sin(a*Math.PI/180)).toFixed(2),(-r*Math.cos(a*Math.PI/180)).toFixed(2)],fs=Math.max(7,Math.min(13,150/n+4));
  return ids.map((id,i)=>{
    const a=P(i*w,R),b=P((i+1)*w,R),nm=nameOf(id),t=nm.length>9?nm.slice(0,8)+"…":nm;
    return `<path d="M0 0L${a[0]} ${a[1]}A${R} ${R} 0 0 1 ${b[0]} ${b[1]}Z" style="fill:color-mix(in srgb,var(--accent) ${i%2?18:38}%,var(--card));stroke:var(--line)"/><text transform="rotate(${(i+.5)*w-90}) translate(24,0)" style="fill:var(--ink);font-size:${fs}px;dominant-baseline:middle">${esc(t)}</text>`
  }).join("")
}

// Fléchettes : la roue tourne, le joueur touché est celui sous le point cliqué à l'impact.
function gDarts(present,c,done,cand){
  const k=c.length,g=box("Fléchettes",`<svg viewBox="-110 -118 220 240" class="wsv" style="cursor:crosshair;touch-action:none"><g id="wg"></g><g id="dt"></g></svg>`,c,done);
  let pool=[...(cand||present)],res=[],th=0,last=performance.now(),fl=null,busy=false;
  g.res=res;
  const sv=g.q("svg"),wg=g.q("#wg"),dt=g.q("#dt"),msg=()=>g.say(`Fléchette ${res.length+1}/${k} : clique sur la cible`);
  g.fill=()=>{
    pool=pool.filter(x=>!res.includes(x));
    while(res.length<k&&pool.length){
      const x=pool[Math.floor(Math.random()*pool.length)];
      res.push(x);
      pool=pool.filter(y=>y!==x)
    }
  };
  wg.innerHTML=wedges(pool);
  msg();
  const loop=now=>{
    if(g.dead)return;
    th=(th+380*(now-last)/1000)%360;
    last=now;
    wg.setAttribute("transform","rotate("+th+")");
    if(fl){
      const p=Math.min(1,(now-fl.t0)/450),e=1-Math.pow(1-p,2);
      dt.firstChild.setAttribute("transform",`translate(${fl.x*e},${125+(fl.y-125)*e})`);
      if(p>=1){
        dt.innerHTML="";
        const r=Math.hypot(fl.x,fl.y),phi=(Math.atan2(fl.x,-fl.y)*180/Math.PI+360)%360,la=(phi-th+360)%360;
        fl=null;
        if(r>100){
          g.say("Raté ! Relance…");
          g.wait(()=>{
            busy=false;
            msg()
          },900)
        } else{
          const id=pool[Math.floor(la/(360/pool.length))%pool.length];
          wg.insertAdjacentHTML("beforeend",`<g transform="rotate(${la}) translate(0,${-r})"><circle r="4" style="fill:var(--bad)"/></g>`);
          res.push(id);
          g.say(nameOf(id)+" est tiré !");
          g.wait(()=>{
            pool=pool.filter(x=>x!==id);
            if(res.length>=k)g.end();
            else{
              wg.innerHTML=wedges(pool);
              busy=false;
              msg()
            }
          },1300)
        }
      }
    }
    g.raf=requestAnimationFrame(loop)
  };
  g.raf=requestAnimationFrame(loop);
  sv.onpointerdown=ev=>{
    if(busy||g.dead)return;
    const pt=sv.createSVGPoint();
    pt.x=ev.clientX;
    pt.y=ev.clientY;
    const q=pt.matrixTransform(sv.getScreenCTM().inverse());
    busy=true;
    g.say("");
    dt.innerHTML='<g><circle r="5" style="fill:var(--bad)"/><path d="M0 5V18" style="stroke:var(--bad);stroke-width:2"/></g>';
    fl={t0:performance.now(),x:q.x,y:q.y}
  }
}

// Roue : « Lancer » accélère, « Stop ! » freine ; le joueur sous la flèche est tiré.
function gWheel(present,c,done,cand){
  const k=c.length,g=box("Roue à lancer",`<svg viewBox="-110 -118 220 236" class="wsv"><g id="wg"></g><polygon points="-9,-117 9,-117 0,-98" style="fill:var(--bad)"/></svg><div class="row"><button class="btn" type="button" data-go></button></div>`,c,done);
  let pool=[...(cand||present)],res=[],th=0,w=0,st="idle",last=0;
  g.res=res;
  const wg=g.q("#wg"),go=g.q("[data-go]"),draw=()=>{
    wg.innerHTML=wedges(pool);
    wg.setAttribute("transform","rotate("+th+")")
  },lab=()=>{
    go.textContent=k>1?`Lancer la roue (${res.length+1}/${k})`:"Lancer la roue"
  };
  g.fill=()=>{
    pool=pool.filter(x=>!res.includes(x));
    while(res.length<k&&pool.length){
      const x=pool[Math.floor(Math.random()*pool.length)];
      res.push(x);
      pool=pool.filter(y=>y!==x)
    }
  };
  draw();
  lab();
  const loop=now=>{
    if(g.dead)return;
    const dt=Math.min(.05,(now-last)/1000);
    last=now;
    if(st==="up")w=Math.min(600,w+500*dt);
    else if(st==="stop")w=Math.max(0,w-170*dt);
    th=(th+w*dt)%360;
    wg.setAttribute("transform","rotate("+th+")");
    if(st==="stop"&&w<=0){
      st="done";
      const id=pool[Math.floor(((360-th)%360)/(360/pool.length))%pool.length];
      res.push(id);
      g.say(nameOf(id)+" est tiré !");
      g.wait(()=>{
        pool=pool.filter(x=>x!==id);
        if(res.length>=k)g.end();
        else{
          draw();
          st="idle";
          go.disabled=false;
          lab();
          g.say("")
        }
      },1300);
      return
    }
    g.raf=requestAnimationFrame(loop)
  };
  go.onclick=()=>{
    if(st==="idle"){
      st="up";
      w=0;
      go.textContent="Stop !";
      last=performance.now();
      g.say("");
      g.raf=requestAnimationFrame(loop)
    }else if(st==="up"){
      st="stop";
      go.disabled=true
    }
  }
}

// Machine à sous : un rouleau par payeur, arrêté à la main ; chaque rouleau exclut les joueurs déjà tirés.
function gSlots(present,c,done,cand){
  const k=c.length,g=box("Machine à sous",`<div class="reels">${c.map(()=>'<div class="reel"><span>?</span></div>').join("")}</div><div class="row"><button class="btn" type="button" data-go></button></div>`,c,done);
  let pool=[...(cand||present)],res=[],st="idle";
  g.res=res;
  const rl=[...g.ov.querySelectorAll(".reel span")],go=g.q("[data-go]"),lab=()=>{
    go.textContent=k>1?`Lancer le rouleau (${res.length+1}/${k})`:"Lancer le rouleau"
  };
  g.fill=()=>{
    pool=pool.filter(x=>!res.includes(x));
    while(res.length<k&&pool.length){
      const x=pool[Math.floor(Math.random()*pool.length)];
      res.push(x);
      pool=pool.filter(y=>y!==x)
    }
  };
  lab();
  const show=(sp,id)=>{
    sp.textContent=nameOf(id);
    sp.style.animation="none";
    void sp.offsetWidth;
    sp.style.animation="slot .12s ease-out"
  };
  go.onclick=()=>{
    if(st==="idle"){
      st="spin";
      go.textContent="Stop !";
      const sp=rl[res.length],ord=[...pool].sort(()=>Math.random()-.5);
      let i=Math.floor(Math.random()*ord.length),dec=0;
      const tick=()=>{
        if(g.dead)return;
        i=(i+1)%ord.length;
        show(sp,ord[i]);
        if(st==="spin")g.wait(tick,70);
        else if(dec<6)g.wait(tick,[100,140,200,280,400,560][dec++]);
        else{
          const id=ord[i];
          res.push(id);
          sp.parentNode.classList.add("win");
          pool=pool.filter(x=>x!==id);
          st="idle";
          if(res.length>=k)g.wait(g.end,900);
          else g.wait(()=>{
            go.disabled=false;
            lab()
          },800)
        }
      };
      tick()
    } else if(st==="spin"){
      st="stop";
      go.disabled=true
    }
  }
}

// Cartes : numérotées, mélangées face cachée ; chaque clic révèle un payeur de c.
function gCards(present,c,done){
  const k=c.length,g=box("Les cartes",`<div class="cards">${present.map((id,i)=>`<button class="cd" type="button"><i class="f">${esc(nameOf(id))}</i><i class="b">${i+1}</i></button>`).join("")}</div>`,c,done);
  const cd=[...g.ov.querySelectorAll(".cd")],grid=g.q(".cards");
  let picks=0,ready=false;
  g.say("Voici les participants…");
  g.wait(()=>{
    cd.forEach(e=>{
      e.classList.add("down");
      e.style.setProperty("--dx",(Math.random()*160-80)+"px");
      e.style.setProperty("--dy",(Math.random()*120-60)+"px");
      e.style.setProperty("--r",(Math.random()*60-30)+"deg")
    });
    g.say("Mélange en cours…");
    grid.classList.add("shuf");
    g.wait(()=>{
      grid.classList.remove("shuf");
      ready=true;
      g.say(`Clique sur ${k} carte${k>1?"s":""}`)
    },2100)
  },1800);
  cd.forEach(e=>e.onclick=()=>{
    if(!ready||picks>=k||!e.classList.contains("down"))return;
    e.querySelector(".f").textContent=nameOf(c[picks]);
    e.classList.remove("down");
    e.classList.add("hit");
    picks++;

      ready=false;
      g.wait(()=>{
        const rest=present.filter(x=>!c.includes(x)).sort(()=>Math.random()-.5);
        cd.filter(x=>x.classList.contains("down")).forEach((x,i)=>{
          x.querySelector(".f").textContent=nameOf(rest[i]);
          x.classList.remove("down");
          x.classList.add("rest")
        });
        g.wait(g.end,1500)
      },900)

  })
}

// Grattage : une case par payeur, révélée quand plus de 55 % de la surface est grattée.
function gScratch(present,c,done){
  const k=c.length,g=box("Jeu de grattage",`<p class="sub" style="text-align:center">Gratte ${k>1?"les cases":"la case"} pour découvrir qui paie.</p><div class="scs">${c.map(id=>`<div class="sc"><b>${esc(nameOf(id))}</b><canvas></canvas></div>`).join("")}</div>`,c,done);
  let left=k;
  g.ov.querySelectorAll(".sc").forEach(e=>{
    const cv=e.querySelector("canvas"),w=cv.width=e.clientWidth,h=cv.height=e.clientHeight,x=cv.getContext("2d",{willReadFrequently:true});
    const gr=x.createLinearGradient(0,0,w,h);
    gr.addColorStop(0,"#aab3c6");
    gr.addColorStop(.5,"#eef1f7");
    gr.addColorStop(1,"#98a2b8");
    x.fillStyle=gr;
    x.fillRect(0,0,w,h);
    for(let i=0; i<300; i++){
      x.fillStyle=`rgba(255,255,255,${Math.random()*.4})`;
      x.fillRect(Math.random()*w,Math.random()*h,2,2)
    }
    x.fillStyle="rgba(55,65,90,.6)";
    x.font="600 15px system-ui,sans-serif";
    x.textAlign="center";
    x.textBaseline="middle";
    x.fillText("Gratte ici",w/2,h/2);
    let down=false,fin=false,n=0,lp=null;
    const burst=()=>{
      for(let i=0; i<18; i++){
        const a=Math.random()*6.283,d=30+Math.random()*50,s=document.createElement("i");
        s.className="sp";
        s.style.cssText=`--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;background:hsl(${Math.random()*360} 90% 60%)`;
        e.appendChild(s);
        setTimeout(()=>s.remove(),900)
      }
    };
    const reveal=()=>{
      if(fin)return;
      fin=true;
      cv.style.transition="opacity .45s";
      cv.style.opacity=0;
      setTimeout(()=>cv.remove(),500);
      e.classList.add("won");
      burst();
      if(--left===0)g.wait(g.end,1300)
    };
    const check=()=>{
      const d=x.getImageData(0,0,w,h).data;
      let t=0,m=0;
      for(let i=3; i<d.length; i+=64){
        m++;
        if(d[i]<40)t++
      }
      if(t/m>.55)reveal()
    };
    const sc=ev=>{
      const b=cv.getBoundingClientRect(),px=(ev.clientX-b.left)*w/b.width,py=(ev.clientY-b.top)*h/b.height;
      x.globalCompositeOperation="destination-out";
      x.lineWidth=30;
      x.lineCap="round";
      x.beginPath();
      x.moveTo(lp?lp[0]:px,lp?lp[1]:py);
      x.lineTo(px+.01,py);
      x.stroke();
      lp=[px,py];
      if(++n%5===0)check()
    };
    cv.onpointerdown=ev=>{
      down=true;
      lp=null;
      cv.setPointerCapture(ev.pointerId);
      sc(ev)
    };
    cv.onpointermove=ev=>{
      if(down)sc(ev)
    };
    cv.onpointerup=cv.onpointercancel=()=>{
      down=false;
      check()
    }
  })
}

  };

    const sel=[],ex=present.filter(id=>!(cand||present).includes(id));
    ov.innerHTML=`<div class="rb"><h2>Tirage à l’ancienne</h2><p class="sub" style="text-align:center">Tire tes cartes, puis clique sur ${k>1?"les "+k+" personnes tirées":"la personne tirée"}.</p>${ex.length?`<p class="sub" style="text-align:center">À l’écart (a payé au dernier tirage) : ${esc(list(ex))}.</p>`:""}<div class="tiles pt2">${(cand||present).map(id=>`<button class="tile pk" type="button" data-id="${id}"><b>${esc(nameOf(id))}</b></button>`).join("")}</div><p class="rr"></p><div class="row"><button class="btn" type="button" data-ok disabled>Valider</button><button class="ghost" type="button" data-back>Retour</button></div></div>`;
    const ok=ov.querySelector("[data-ok]"),rr=ov.querySelector(".rr"),upd=()=>{
      ok.disabled=sel.length!==k;
      rr.textContent=sel.length+"/"+k+" sélectionné"+(k>1?"s":"")
    };
    ov.querySelectorAll(".pk").forEach(b=>b.onclick=()=>{
      const id=b.dataset.id,i=sel.indexOf(id);
      if(i>=0){
        sel.splice(i,1);
        b.classList.remove("on")
      }else if(sel.length<k){
        sel.push(id);
        b.classList.add("on")
      }
      upd()
    });
    upd();
    ok.onclick=()=>{
      ov.remove();
      picking=false;
      done([...sel])
    };
    ov.querySelector("[data-back]").onclick=home
  };
  home()
}

// Coche / décoche une personne pour aujourd'hui (mise à jour immédiate, annulée si l'écriture échoue).
function togglePresent(id){
  const t=todayStr(),index=state.draws.findIndex(d=>d.id===t),previous=index>=0?state.draws[index]:null,cur=previous||{id:t,date:t,present:[],payers:[],edited:false},present=cur.present.includes(id)?cur.present.filter(x=>x!==id):[...cur.present,id],next={...cur,id:t,date:t,present,payers:pays(cur).filter(x=>present.includes(x)),price:state.price,edited:!!cur.edited};
  if(index>=0)state.draws[index]=next;
  else state.draws.push(next);
  state.msg="";
  render();
  persist(async()=>{
    const {error}=await state.db.from("draws").upsert([next]);
    if(error){
      const i=state.draws.findIndex(d=>d.id===t);
      if(previous){
        if(i>=0)state.draws[i]=previous;
        else state.draws.push(previous)
      }else state.draws=state.draws.filter(d=>d.id!==t);
      throw error
    }
  })
}

// Records de l'année : podiums des plus chanceux / malchanceux, séries, plus grosse tablée (égalités = tous les noms).
function vRecs(st){
  const rs=state.people.map(p=>({p,s:st[p.id]||{n:0,p:0}})).filter(r=>r.s.n>0);
  if(!rs.length)return"";
  const ds=yd().filter(d=>(d.present||[]).length).sort((a,b)=>a.id<b.id?-1:1),cur={},best={},c=[];
  ds.forEach(d=>{
    const pa=pays(d);
    (d.present||[]).forEach(id=>{
      if(pa.includes(id))cur[id]=0;
      else{
        cur[id]=(cur[id]||0)+1;
        if(cur[id]>(best[id]||0))best[id]=cur[id]
      }
    })
  });
  const s=n=>n>1?"s":"",jn=(a,ns)=>{
    if(!ns)a=[...a].sort((x,y)=>x.localeCompare(y,"fr"));
    return a.length>1?a.slice(0,-1).join(", ")+" et "+a[a.length-1]:a.join("")
  },tops=(a,f)=>{
    const m=Math.max(...a.map(f));
    return a.filter(x=>f(x)===m)
  },rn=r=>r.map(x=>x.p.name),ra=r=>r.s.p/r.s.n;
  const gp=tops(rs,r=>r.s.p);
  if(gp[0].s.p>0)c.push(["Plus gros payeur",jn(rn(gp)),`${gp[0].s.p} café${s(gp[0].s.p)} payé${s(gp[0].s.p)}`]);
  const grp=(arr,cmp,det,pct)=>{
    const o=[];
    [...arr].sort(cmp).forEach(r=>{
      const g=o[o.length-1];
      if(g&&cmp(g[0],r)===0)g.push(r);
      else o.push([r])
    });
    return o.slice(0,3).map(g=>({names:jn(rn(g)),det:det(g[0]),pct:pct?pct(g[0]):""}))
  };
  c.push({pod:"ok",label:"Les plus chanceux",pl:grp(rs,(a,b)=>ra(a)-ra(b)||b.s.n-a.s.n,r=>`${r.s.n} présence${s(r.s.n)}, ${r.s.p} payé${s(r.s.p)}`)});
  const pay=rs.filter(r=>r.s.p>0);
  if(pay.length)c.push({pod:"bad",label:"Les plus malchanceux",pl:grp(pay,(a,b)=>ra(b)-ra(a)||b.s.n-a.s.n,r=>`${r.s.p} payé${s(r.s.p)} sur ${r.s.n}`,r=>`[${Math.round(100*ra(r))} %]`)});
  const bk=Object.keys(best);
  if(bk.length){
    const m=Math.max(...bk.map(id=>best[id]));
    c.push(["Plus longue série sans payer",jn(bk.filter(id=>best[id]===m).map(nameOf)),`${m} présence${s(m)} d’affilée`])
  }
  const ak=state.people.filter(p=>p.active!==false&&cur[p.id]>0);
  if(ak.length){
    const m=Math.max(...ak.map(p=>cur[p.id]));
    c.push(["Série en cours",jn(ak.filter(p=>cur[p.id]===m).map(p=>p.name)),`${m} présence${s(m)} sans payer`])
  }
  if(ds.length){
    const m=Math.max(...ds.map(d=>d.present.length)),ts=ds.filter(d=>d.present.length===m);
    c.push(["Plus grosse tablée",jn(ts.map(d=>fmt(d.id)),1),`${m} présents`+(ts.length===1&&priceOf(ts[0])?", "+eur(amt(ts[0])):"")])
  }
  return `<h2>Records</h2><div class="recs">${c.map(x=>x.pod?`<div class="rec pod"><span class="rl">${x.label}</span><div class="podium ${x.pod}">${[1,0,2].filter(i=>x.pl[i]).map(i=>`<div class="step s${i+1}"><span class="nm">${esc(x.pl[i].names)}</span>${x.pl[i].pct?`<span class="pct">${esc(x.pl[i].pct)}</span>`:""}<span class="rd">${esc(x.pl[i].det)}</span><div class="bar">${i+1}</div></div>`).join("")}</div></div>`:`<div class="rec"><span class="rl">${x[0]}</span><b>${esc(x[1])}</b><span class="rd">${esc(x[2])}</span></div>`).join("")}</div>`
}

// Onglet « Stats » : résumé, records, graphique et tableau (par ordre alphabétique).
function vStats(){
  const st=stats(),rows=state.people.map(p=>({p,s:st[p.id]||{n:0,p:0,m:0,last:""}})).filter(r=>r.p.active!==false||r.s.n>0).sort((a,b)=>byName(a.p,b.p)),dr=yd().filter(d=>pays(d).length),tot=dr.reduce((s,d)=>s+amt(d),0),nd=dr.length||1,cr=rows.filter(r=>r.s.n),mx=Math.max(1,...cr.map(r=>r.s.n));
  const chart=cr.length?`<h2>Qui paie le plus selon ses présences</h2><div class="chart ${state.anim?"anim":""}"><p class="lg"><span class="k1"></span>Présences<span class="k2"></span>Payés</p><p class="sub" style="margin:0 0 8px">Classés par ordre alphabétique.</p>${cr.map((r,i)=>`<div class="pc"><div class="ph"><b>${esc(r.p.name)}</b><span>${r.s.p} payé${r.s.p>1?"s":""} sur ${r.s.n} présence${r.s.n>1?"s":""}, soit ${Math.round(100*r.s.p/r.s.n)} %</span></div><div class="pr"><span class="pl">Présences</span><div class="pt"><span class="b1" style="width:${100*r.s.n/mx}%;--i:${i}"></span></div><span class="pn">${r.s.n}</span></div><div class="pr"><span class="pl">Payés</span><div class="pt"><span class="b2" style="width:${100*r.s.p/mx}%;--i:${i}"></span></div><span class="pn">${r.s.p}</span></div></div>`).join("")}</div>`:"";
  return `<p class="sub">${yd().reduce((s,d)=>s+pays(d).length,0)} cafés payés en ${state.statYear}.${tot?` Montant total : ${eur(tot)}, soit ${eur(tot/nd)} par tirage en moyenne.`:(state.price?"":" Définis le prix dans Options pour voir les montants.")}</p>${vRecs(st)}${chart}<div class="tw"><table><tr><th>Nom</th><th>Présences</th><th>Payés</th><th>Part payée</th><th>Montant</th><th>Dernier</th></tr>${rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td>${r.s.n}</td><td>${r.s.p}</td><td>${r.s.n?Math.round(100*r.s.p/r.s.n)+" %":"—"}</td><td>${r.s.m?eur(r.s.m):"—"}</td><td>${r.s.last?fmt(r.s.last):"—"}</td></tr>`).join("")||'<tr><td class="empty" colspan="6">Pas encore de données.</td></tr>'}</table></div>${vYears()}`
}

// Onglet « Équipe » : ajout, retrait (désactivation) et réactivation.
function vTeam(){
  const a=state.people.filter(p=>p.active!==false).sort(byName),i=state.people.filter(p=>p.active===false).sort(byName);
  return `<div class="row"><input type="text" id="nn" placeholder="Prénom" value="${esc(state.newName)}" autocomplete="off"><button class="btn" data-act="add">Ajouter</button></div><ul class="list">${a.map(p=>`<li class="pl"><span>${esc(p.name)}</span><button class="ghost" data-act="rm" data-id="${p.id}">Retirer</button></li>`).join("")||'<li class="empty">Personne pour l’instant.</li>'}</ul>${i.length?`<h2>Anciens</h2><ul class="list">${i.map(p=>`<li class="pl"><span>${esc(p.name)}</span><button class="ghost" data-act="react" data-id="${p.id}">Réactiver</button></li>`).join("")}</ul>`:""}`
}

// Onglet « Options » : prix du café, jeux activés et par défaut, export CSV.
function vOpts(){
  const g=state.games||{off:[],def:"cartes"},on=GAMES.filter(x=>!g.off.includes(x.id)),dg=(on.find(x=>x.id===g.def)||on[0]||{}).id;
  return `<label class="fld">Prix d’un café (€)<input type="text" inputmode="decimal" id="pr" data-act="price" value="${state.price?String(state.price).replace(".",","):""}" placeholder="1,20" autocomplete="off" style="display:block;margin-top:4px;width:100%"></label><p class="sub">Le prix sert à calculer le montant de chaque tirage. Les tirages passés conservent leur prix enregistré.</p><h2>Jeux de tirage</h2><ul class="list">${GAMES.map(x=>`<li><label><input type="checkbox" data-act="gon" data-id="${x.id}" ${g.off.includes(x.id)?"":"checked"}><span>${x.name}</span></label></li>`).join("")}</ul><label class="fld">Jeu par défaut<select data-act="gdef">${on.map(x=>`<option value="${x.id}" ${x.id===dg?"selected":""}>${x.name}</option>`).join("")}</select></label><p class="sub">Le jeu par défaut est proposé en premier. ${state.gshared?"Ces réglages sont partagés : tout le monde voit les mêmes.":"Ces réglages sont enregistrés sur cet appareil seulement."}</p><h2>Export</h2><button class="btn" type="button" data-act="csv">Exporter les tirages (CSV)</button><p class="sub">Un fichier avec un tirage par ligne : date, présents, payeurs, prix du café et montant.</p>`
}

/* ---------- 9. ÉVÉNEMENTS ----------
   Délégation : chaque bouton porte data-act, traité ici. */
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");
  if(!b)return;
  const a=b.dataset.act,d=b.dataset.d,id=b.dataset.id;
  if(a==="tab"){
    state.tab=b.dataset.v;
    state.anim=state.tab==="stats";
    state.editing=null;
    state.draft=null;
    state.confirmDel=null;
    render()
  }else if(a==="csv"){
    exportCsv()
  }else if(a==="year"){
    state.statYear=b.dataset.v;
    state.anim=true;
    render()
  }else if(a==="draw"){
    const t=todayStr(),cur=getDraw(t);
    if(cur&&pays(cur).length&&state.confirmDel!=="redraw"){
      state.confirmDel="redraw";
      render();
      return
    }
    state.confirmDel=null;
    pick()
  }else if(a==="selall"){
    const t=todayStr(),cur=getDraw(t)||{present:[],payers:[],edited:false},ids=state.people.filter(p=>p.active!==false).map(p=>p.id);
    if(!ids.length)return;
    const present=ids.every(x=>cur.present.includes(x))?cur.present.filter(x=>!ids.includes(x)):[...new Set([...cur.present,...ids])],next={id:t,date:t,present,payers:pays(cur).filter(x=>present.includes(x)),price:state.price,edited:!!cur.edited};
    const i=state.draws.findIndex(x=>x.id===t);
    if(i>=0)state.draws[i]=next;
    else state.draws.push(next);
    render();
    persist(()=>state.db.from("draws").upsert([next]))
  }else if(a==="edit"){
    if(state.confirmDel==="edit:"+d){
      const x=getDraw(d);
      state.editing=d;
      state.draft={id:d,present:[...((x&&x.present)||[])],payers:x?[...pays(x)]:[]};
      state.confirmDel=null
    }else state.confirmDel="edit:"+d;
    render()
  }else if(a==="cancel"){
    const x=getDraw(state.editing);
    state.editing=null;
    state.draft=null;
    state.confirmDel=null;
    if(x&&x.id!==todayStr()&&!(x.present||[]).length&&!pays(x).length){
      state.draws=state.draws.filter(y=>y.id!==x.id);
      render();
      persist(()=>state.db.from("draws").delete().eq("id",x.id))
    }else render()
  }else if(a==="save"){
    const n=state.draft;
    if(!n||n.id!==d)return;
    const ex=getDraw(d),next={id:d,date:d,present:[...n.present],payers:[...n.payers],price:ex?priceOf(ex):state.price,edited:true},i=state.draws.findIndex(x=>x.id===d);
    if(i>=0)state.draws[i]={...state.draws[i],...next};
    else state.draws.push({...next});
    state.editing=null;
    state.draft=null;
    state.confirmDel=null;
    render();
    persist(()=>state.db.from("draws").upsert([next]))
  }else if(a==="del"){
    if(state.confirmDel===d){
      state.confirmDel=null;
      state.editing=null;
      state.draft=null;
      state.draws=state.draws.filter(x=>x.id!==d);
      render();
      persist(()=>state.db.from("draws").delete().eq("id",d))
    }else{
      state.confirmDel=d;
      render()
    }
  }else if(a==="newday"){
    const v=state.ndVal;
    if(!v)return;
    if(v>todayStr()){
      state.msg="Impossible d’ajouter un tirage dans le futur.";
      render();
      return
    }
    const ex=getDraw(v);
    if(ex){
      state.confirmDel="edit:"+v;
      render();
      return
    }
    state.msg="";
    state.editing=v;
    state.draft={id:v,present:[],payers:[]};
    const next={id:v,date:v,present:[],payers:[],price:state.price,edited:true};
    state.draws.push(next);
    render();
    persist(()=>state.db.from("draws").upsert([next]))
  }else if(a==="add"){
    const n=state.newName.trim();
    if(!n)return;
    state.newName="";
    render();
    if(!state.people.some(p=>p.active!==false&&p.name.toLowerCase()===n.toLowerCase()))persist(()=>state.db.from("people").insert([{name:n,active:true}]))
  }else if(a==="rm"){
    state.people=state.people.map(p=>p.id===id?{...p,active:false}:p);
    render();
    persist(()=>state.db.from("people").update({active:false}).eq("id",id))
  }else if(a==="react"){
    state.people=state.people.map(p=>p.id===id?{...p,active:true}:p);
    render();
    persist(()=>state.db.from("people").update({active:true}).eq("id",id))
  }
});
// Champs : présence, prix, options de jeux, édition d'un tirage.
document.addEventListener("change",e=>{
  const t=e.target,a=t.dataset.act,d=t.dataset.d,id=t.dataset.id;
  if(a==="pres")togglePresent(id);
  else if(a==="price"){
    const v=parseFloat(t.value.replace(",","."));
    if(Number.isFinite(v)&&v>=0){
      state.price=v;
      render();
      persist(()=>state.db.from("settings").upsert([{key:"main",price:v}]))
    }
  }else if(a==="gon"){
    const g=state.games||(state.games={off:[],def:"cartes"});
    if(t.checked)g.off=g.off.filter(x=>x!==id);
    else if(GAMES.filter(x=>!g.off.includes(x.id)).length>1)g.off=[...g.off,id];
    else{
      t.checked=true;
      state.msg="Garde au moins un jeu activé.";
      render();
      return
    }
    if(g.off.includes(g.def))g.def=(GAMES.find(x=>!g.off.includes(x.id))||{}).id;
    saveGames()
  }else if(a==="gdef"){
    state.games.def=t.value;
    saveGames()
  }else if((a==="hpres"||a==="hpay")&&state.draft&&state.draft.id===d){
    const n=state.draft;
    if(a==="hpres"){
      n.present=n.present.includes(id)?n.present.filter(x=>x!==id):[...n.present,id];
      n.payers=n.payers.filter(x=>n.present.includes(x))
    }else{
      n.payers=n.payers.includes(id)?n.payers.filter(x=>x!==id):[...n.payers,id];
      if(n.payers.includes(id)&&!n.present.includes(id))n.present.push(id)
    }
    render()
  }
});
// Saisies mémorisées pour survivre aux re-rendus.
document.addEventListener("input",e=>{
  if(e.target.id==="nn")state.newName=e.target.value;
  if(e.target.id==="nd")state.ndVal=e.target.value
});
// Entrée dans le champ prénom = bouton Ajouter.
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="nn"){
    e.preventDefault();
    document.querySelector('[data-act="add"]').click()
  }
});
/* ---------- 10. DÉMARRAGE ---------- */
// Premier rendu (« Chargement… »), puis connexion Supabase, verrou temps réel et abonnement aux changements.
render();
(async()=>{
  if(!SUPABASE_URL||SUPABASE_URL.startsWith("VOTRE")){
    state.nodb=true;
    render();
    return
  }
  state.db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}});
  state.cid=Math.random().toString(36).slice(2);
  state.lk=state.db.channel("draw-lock",{config:{presence:{key:state.cid}}});
  state.lk.on("presence",{event:"sync"},()=>{
    const ps=state.lk.presenceState();
    const b=Object.entries(ps).some(([k,v])=>k!==state.cid&&v.some(m=>m.drawing));
    if(b!==state.busy){state.busy=b;render()}
  }).subscribe(st=>{
    if(st==="SUBSCRIBED")state.lk.track({drawing:false})
  });
  state.timer=setTimeout(()=>{
    if(!(state.loaded.people&&state.loaded.draws&&state.loaded.settings)){
      state.msg="Données injoignables pour l’instant. Vérifie ta connexion.";
      render()
    }
  },10000);
  try{
    await fetchAll();
    recoverPending()
  }catch(e){
    state.msg="Lecture impossible : "+((e&&(e.message||e.code))||"erreur");
    render()
  }
  state.db.channel("public-db").on("postgres_changes",{event:"*",schema:"public"},async()=>{
    try{
      await fetchAll()
    }catch(e){
      state.msg="Lecture impossible : "+((e&&(e.message||e.code))||"erreur");
      render()
    }
  }).subscribe()
})();
